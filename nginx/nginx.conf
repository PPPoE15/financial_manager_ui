events {
        worker_connections 1000;
}

http {
        ##
        # Basic Settings
        ##

        sendfile on;
        tcp_nopush on;
        types_hash_max_size 2048;


        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        # Доверяем схеме только от явно перечисленных адресов внешнего proxy.
        geo $trusted_proxy {
                default 0;
                include /etc/nginx/trusted-proxies.conf;
        }
        map "$trusted_proxy:$http_x_forwarded_proto" $forwarded_scheme {
                default $scheme;
                "1:https" https;
                "1:http" http;
        }
        # Сохраняем исходный Host вместе с нестандартным внешним портом.
        map $http_host $forwarded_host {
                default $http_host;
                "" $host;
        }

        ##
        # Logging Settings
        ##

        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        ##
        # Gzip Settings
        ##

        gzip on;

        ##
        # Virtual Host Configs
        ##

        include /etc/nginx/conf.d/*.conf;
        include /etc/nginx/sites-enabled/*;
        
        server {
                listen 80 default_server;
                listen [::]:80 default_server;
                server_name финансовый-менеджер.рф xn----7sbgjeabhlm8ahbfj6bf3c2i.xn--p1ai;

                # Относительные Location сохраняют внешнюю HTTPS-схему и порт.
                absolute_redirect off;

                # Без URI в proxy_pass путь уходит как есть: оба сервиса сами монтируют API под своим префиксом
                # NOTE(FM-31): Swagger сервисов через nginx не работает: /auth/docs и /transaction/docs уходят как есть (404),
                # а схему они грузят по абсолютному /api/openapi.json, который отдаёт index.html SPA
                # NOTE(FM-31): без URI в proxy_pass бэкенд получает исходный, не нормализованный URI, а location выбирается
                # по нормализованному: /auth/%2e%2e/transaction/… попадёт в сервис авторизации как /auth/../transaction/… (404).
                # Ограничений доступа на уровне nginx нет, поэтому это расхождение маршрутизации, а не обход защиты
                location /auth/ {
                        proxy_pass http://fm_auth_service:80;
                        include /etc/nginx/proxy-headers.conf;
                        }

                # Файл до 5 МиБ плюс multipart: контракт разрешает тело до 6 МиБ включительно.
                location ~ ^/transaction/import-export/imports/(income|outcome)$ {
                        client_max_body_size 6m;
                        error_page 413 = @import_body_too_large;
                        # Повтор POST может создать дубликаты при неизвестном результате сохранения.
                        proxy_next_upstream off;
                        proxy_pass http://fm_transaction_service:80;
                        include /etc/nginx/proxy-headers.conf;
                }

                location @import_body_too_large {
                        default_type application/problem+json;
                        return 413 '{"type":"about:blank","title":"Payload Too Large","status":413,"detail":"Размер файла или запроса превышает допустимый лимит.","instance":"$uri","code":"FM-413301"}';
                }

                location /transaction/ {
                        proxy_pass http://fm_transaction_service:80;
                        include /etc/nginx/proxy-headers.conf;
                        }

                # Ассеты сборки: отсутствующий файл (например, чанк старой сборки после редеплоя) — 404, а не index.html
                location /assets/ {
                        root   /usr/share/nginx/html;
                        try_files $uri =404;
                }

                location / {
                        root   /usr/share/nginx/html;
                        index  index.html index.htm;
                        # SPA: неизвестные пути (вложенные маршруты при обновлении страницы) отдают index.html
                        try_files $uri $uri/ /index.html;
                }
        }
}
