# Внешний proxy обязан передавать исходный Host и перезаписывать X-Forwarded-Proto.
proxy_set_header Host $forwarded_host;
proxy_set_header X-Forwarded-Host $forwarded_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $forwarded_scheme;
# Не оставляем альтернативный источник схемы, присланный клиентом.
proxy_set_header Forwarded "";
