name: Frontend CI

on:
  push:
    branches: ["dev", "master"]
  pull_request: {}

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - run: npm ci

    - name: Lint
      run: npx eslint .

    - name: Type-check and build
      run: npm run build
