name: Frontend CI

on:
  push:
    branches: ["dev", "master"]
  pull_request: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npx eslint .
      - name: Type-check and build
        run: npm run build
      - name: Test
        run: npm run test

  publish:
    needs: build
    if: ${{ success() && needs.build.result == 'success' && github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master') }}
    runs-on: ubuntu-latest
    # Both branches share SHA tags; serialize the existence check and publication.
    concurrency:
      group: fm-ui-publication
      cancel-in-progress: false
    outputs:
      image: ${{ steps.publish.outputs.image }}
      sha: ${{ github.sha }}
      environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || 'pppoe15' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish or reuse the checked SHA
        id: publish
        env:
          IMAGE_REPOSITORY: ${{ vars.DOCKERHUB_USERNAME || 'pppoe15' }}/fm-ui
          GIT_SHA: ${{ github.sha }}
          ENVIRONMENT: ${{ github.ref_name }}
          PUBLICATION_METADATA: ${{ runner.temp }}/publication.json
        run: bash scripts/publish-image.sh
      - name: Save deployment reference
        uses: actions/upload-artifact@v4
        with:
          name: fm-ui-${{ github.ref_name }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication.json
          if-no-files-found: error
